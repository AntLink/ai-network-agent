name: Release build, SBOM and signing

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Immutable release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved release commit
        uses: actions/checkout@v4

      - name: Set release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "central_image=${REGISTRY}/${OWNER}/ainet-api" >> "$GITHUB_OUTPUT"
          echo "edge_image=${REGISTRY}/${OWNER}/ainet-edge" >> "$GITHUB_OUTPUT"
          echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: edge/go.mod
          cache-dependency-path: edge/go.sum

      - name: Test Edge
        working-directory: edge
        run: go test -race ./...

      - name: Build Edge binary
        working-directory: edge
        run: go build -trimpath -ldflags "-s -w" -o ainet-edge-linux ./cmd/ainet-edge

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Build and push Central
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile.release
          push: true
          tags: ${{ steps.meta.outputs.central_image }}:${{ steps.meta.outputs.tag }}
          labels: org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push Edge
        uses: docker/build-push-action@v6
        with:
          context: edge
          file: edge/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.edge_image }}:${{ steps.meta.outputs.tag }}
          labels: org.opencontainers.image.revision=${{ github.sha }}

      - name: Install Syft
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.meta.outputs.central_image }}:${{ steps.meta.outputs.tag }}
          format: cyclonedx-json
          output-file: central-sbom.json
          upload-artifact: false

      - name: Sign and attest Central image
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMAGE: ${{ steps.meta.outputs.central_image }}:${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          DIGEST="$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          REF="${IMAGE%@*}@${DIGEST}"
          cosign sign --yes "$REF"
          cosign attest --yes --predicate central-sbom.json --type cyclonedx "$REF"
          echo "central_ref=$REF" >> "$GITHUB_ENV"

      - name: Verify Central signature and SBOM attestation
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          cosign verify "$central_ref" \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          cosign verify-attestation "$central_ref" --type cyclonedx \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Publish release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ steps.meta.outputs.tag }}
          path: central-sbom.json
