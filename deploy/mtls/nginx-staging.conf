# Persistent staging mTLS terminator. Mount PKI material from a secret volume.
user nginx;
events {}

http {
    upstream central_api {
        server api:8000;
    }

    map $ssl_client_s_dn $client_edge_id {
        default "";
        ~^CN=(?<edge_cn>[^,]+) $edge_cn;
    }

    server {
        listen 8443 ssl;
        server_name central;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate /etc/ainet/pki/central.crt;
        ssl_certificate_key /etc/ainet/pki/central.key;
        ssl_client_certificate /etc/ainet/pki/ca.crt;
        ssl_trusted_certificate /etc/ainet/pki/ca.crt;
        ssl_crl /etc/ainet/pki/ca.crl;
        ssl_verify_client on;
        ssl_verify_depth 2;

        location / {
            proxy_pass http://central_api;
            proxy_set_header X-Client-Edge-ID $client_edge_id;
            proxy_set_header X-Client-Cert-Fingerprint "";
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
